# The unit-test build compiles the app's pure sources (engine, dialogue, ui models) and every test in one go: the default heap of the
# compiler (512 MB) runs out ("GC overhead limit exceeded", CI run of d82d4827). Locally the README's command already needed more.
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx3g
