plugins {
	id 'com.android.application'
	id 'org.jetbrains.kotlin.plugin.compose'
}

// CI passes the app's identity, version, signing key and update source as Gradle properties
// (-Pad...). Local builds fall back to these defaults.
def adProperty = { String name, String fallback ->
	project.hasProperty(name) ? project.property(name).toString() : fallback
}
def adKeystore = adProperty("keystore", "")

android {
	namespace = "com.logie.azuredreams"
	compileSdk = 35
	// Also what strips the native libraries' debug symbols when packaging.
	ndkVersion = "29.0.14206865"

	buildFeatures {
		buildConfig = true
		compose = true
	}

	defaultConfig {
		applicationId = adProperty("adApplicationId", "com.logie.azure")
		minSdk = 26
		targetSdk = 35
		versionCode = adProperty("adVersionCode", "1").toInteger()
		versionName = adProperty("adVersionName", "1.0")

		buildConfigField "String", "AD_UPDATE_REPO", "\"${adProperty("adUpdateRepo", "")}\""
		buildConfigField "String", "AD_RELEASE_TAG_PREFIX", "\"${adProperty("adReleaseTagPrefix", "")}\""
		buildConfigField "String", "AD_UPDATE_TOKEN", "\"${adProperty("adUpdateToken", "")}\""

		ndk {
			// Phones only: the emulator core is built for arm64.
			abiFilters "arm64-v8a"
		}
	}

	signingConfigs {
		ad {
			if (adKeystore) {
				storeFile = file(adKeystore)
				storePassword = adProperty("storepass", "")
				keyAlias = adProperty("keyalias", "")
				keyPassword = adProperty("keypass", "")
			}
		}
	}

	buildTypes {
		release {
			minifyEnabled = true
			shrinkResources = true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
			signingConfig = adKeystore ? signingConfigs.ad : signingConfigs.debug
		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

	sourceSets {
		main {
			// libswanstation_libretro_android.so from scripts/build-swanstation.sh
			jniLibs.srcDirs += ['../core']
		}
	}

	lint {
		abortOnError = false
		checkReleaseBuilds = false
	}

	packaging {
		jniLibs {
			// LibretroDroid loads the core by its file name from the app's library folder.
			useLegacyPackaging = true
		}
	}
}

dependencies {
	implementation project(':libretrodroid')

	implementation 'androidx.appcompat:appcompat:1.6.1'
	implementation 'androidx.core:core-ktx:1.12.0'
	implementation 'com.google.android.material:material:1.11.0'
	implementation platform('androidx.compose:compose-bom:2025.04.00')
	implementation 'androidx.compose.ui:ui'
	implementation 'androidx.compose.material3:material3'
	implementation 'androidx.compose.material:material-icons-extended'
	implementation 'androidx.activity:activity-compose:1.9.3'
	implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
	implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
}
