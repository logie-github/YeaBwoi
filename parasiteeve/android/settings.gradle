pluginManagement {
	repositories {
		google()
		mavenCentral()
		gradlePluginPortal()
	}
}
dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
	repositories {
		google()
		mavenCentral()
	}
}
rootProject.name = "ParasiteEve"
include ':app'
// LibretroDroid, the libretro frontend library behind Lemuroid, built from source. It's the same
// patched build as the Azure Dreams app's (scripts/prepare-libretrodroid.sh), shared with it.
include ':libretrodroid'
project(':libretrodroid').projectDir = file('../../azuredreams/android/libretrodroid')
