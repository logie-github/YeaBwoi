name: Build APKs

# Builds the apps in games/ (Dolphin XD, Dolphin Colosseum) from the same Dolphin source. Each
# app is its own release: a push only rebuilds and releases the apps whose files changed.
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "games/*/branding/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      app:
        description: App to build and release
        type: choice
        options: [all, xd, colosseum]
        default: all

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOLPHIN_DIR: ${{ github.workspace }}/build/dolphin
  XD_VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  plan:
    name: Pick apps to build
    runs-on: ubuntu-24.04
    outputs:
      games: ${{ steps.pick.outputs.games }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick apps
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.app }}
        run: |
          if [ "$EVENT" = push ]; then
            # Only the apps that changed since their last release.
            games="$(scripts/apps-to-build.sh)"
          elif [ "$EVENT" = workflow_dispatch ] && [ "$REQUESTED" != all ]; then
            games="$REQUESTED"
          else
            games="$(ls games)"
          fi
          json="$(jq -cn '$ARGS.positional' --args $games)"
          echo "Apps to build: $json"
          echo "games=$json" >> "$GITHUB_OUTPUT"
          echo "Apps to build: \`$json\`" >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    name: Unit tests (gestures, mod patching)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Run unit tests
        run: gradle --no-daemon -p unit-tests test

  apk:
    name: Build ${{ matrix.game }} APK
    needs: [plan, unit-tests]
    if: needs.plan.outputs.games != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.plan.outputs.games) }}
    steps:
      - uses: actions/checkout@v4

      - name: Read game settings
        run: |
          source "games/${{ matrix.game }}/game.env"
          {
            echo "APP_ID=$APP_ID"
            echo "APP_NAME=$APP_NAME"
            echo "GAME_NAME=$GAME_NAME"
            echo "APK_FILE=$APK_NAME-$XD_VERSION_NAME.apk"
            echo "RELEASE_TAG=$RELEASE_TAG_PREFIX-${{ github.run_number }}"
          } >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/PyPy || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Set up Gradle before Dolphin is checked out: its wrapper check scans the whole workspace,
      # and Dolphin's third-party code (e.g. SDL's example project) has wrapper jars it doesn't know.
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare source
        run: scripts/prepare-dolphin.sh "${{ matrix.game }}" "$DOLPHIN_DIR"

      - name: Install Android SDK packages
        run: |
          gradle_file="$DOLPHIN_DIR/Source/Android/app/build.gradle.kts"
          ndk=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' "$gradle_file")
          compile_sdk=$(sed -n 's/.*compileSdk = \([0-9]*\).*/\1/p' "$gradle_file")
          echo "NDK $ndk, compileSdk $compile_sdk"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$ndk" "cmake;3.31.6" "platforms;android-$compile_sdk.0" > /dev/null

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: dolphin-android-arm64-${{ hashFiles('dolphin-version.env') }}
          max-size: 2G

      - name: Choose signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DOLPHINXD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "XD_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the key from the DOLPHINXD_KEYSTORE_* secrets."
          else
            echo "XD_KEYSTORE=$GITHUB_WORKSPACE/ci/dolphinxd-ci.p12" >> "$GITHUB_ENV"
            echo "::notice::Signed with the shared CI key in ci/. Add DOLPHINXD_KEYSTORE_* secrets to use your own (see README)."
          fi

      - name: Build release APK
        working-directory: ${{ env.DOLPHIN_DIR }}/Source/Android
        env:
          XD_STOREPASS: ${{ secrets.DOLPHINXD_KEYSTORE_PASSWORD || 'dolphinxd' }}
          XD_KEYALIAS: ${{ secrets.DOLPHINXD_KEY_ALIAS || 'dolphinxd' }}
          XD_KEYPASS: ${{ secrets.DOLPHINXD_KEY_PASSWORD || secrets.DOLPHINXD_KEYSTORE_PASSWORD || 'dolphinxd' }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -Pkeystore="$XD_KEYSTORE" \
            -Pstorepass="$XD_STOREPASS" \
            -Pkeyalias="$XD_KEYALIAS" \
            -Pkeypass="$XD_KEYPASS" \
            -PxdVersionCode=${{ github.run_number }} \
            -PxdVersionName="$XD_VERSION_NAME" \
            -PxdApplicationId="$APP_ID" \
            -PxdAppName="$APP_NAME" \
            -PxdCcache

      - name: Collect APK
        run: |
          mkdir -p dist
          cp "$DOLPHIN_DIR/Source/Android/app/build/outputs/apk/release/app-release.apk" "dist/$APK_FILE"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2" \
            dump badging "dist/$APK_FILE" | head -3
          ls -la dist

      # The APK is published as a GitHub release rather than a workflow artifact: release
      # downloads work straight from a phone and don't use the account's Actions storage quota.
      - name: Publish GitHub release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source dolphin-version.env
          notes="$GAME_NAME for Android, built from Dolphin $DOLPHIN_TAG and commit ${GITHUB_SHA::7}.

          Download **$APK_FILE** below on your phone and open it to install."
          gh release create "$RELEASE_TAG" "dist/$APK_FILE" \
            --target "$GITHUB_SHA" \
            --title "$APP_NAME $XD_VERSION_NAME" \
            --notes "$notes"
