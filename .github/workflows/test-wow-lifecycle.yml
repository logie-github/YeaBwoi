name: Check WoW Android lifecycle
on:
  push:
    paths:
      - '.github/workflows/test-wow-lifecycle.yml'
      - 'warcraft/android/app/src/test/**'
      - 'warcraft/android/app/src/main/java/com/logie/warcraft/local/**'
      - 'warcraft/android/app/src/main/java/com/logie/warcraft/tww/**'
      - 'warcraft/android/app/src/main/java/com/logie/warcraft/felsong/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore runtime sources for Android tests
        id: runtime
        uses: actions/cache/restore@v4
        with:
          path: warcraft/android/winlator
          key: warcraft-winlator-v1-${{ hashFiles('warcraft/winlator-version.env', 'warcraft/patches/winlator/**', 'scripts/prepare-winlator.sh', 'scripts/winlator-rewrite.py', 'warcraft/box64-version.env', 'warcraft/patches/box64/**', 'scripts/build-box64.sh') }}
      - name: Prepare changed runtime sources
        if: steps.runtime.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-zstandard gcc-aarch64-linux-gnu g++-aarch64-linux-gnu patchelf zstd > /dev/null
          scripts/prepare-winlator.sh
      - name: Run Android lifecycle regression tests
        working-directory: warcraft/android
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest
