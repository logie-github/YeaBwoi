name: Build Warcraft

# Builds the Warcraft app (Warcraft I and II Remastered, Warcraft III Reign of Chaos and
# The Frozen Throne, from the user's own files, offline) with the games' runtime, Winlator
# (scripts/prepare-winlator-app.sh warcrafts, cached by its commit and the patches), and publishes
# it as a release (warcrafts-build-N).
on:
  push:
    branches: ["**"]
    paths:
      - "warcrafts/**"
      - "!warcrafts/branding/**"
      - "!warcrafts/**.md"
      - "scripts/prepare-winlator-app.sh"
      - "scripts/winlator-rewrite.py"
      - "scripts/build-stratagus.sh"
      - ".github/workflows/build-warcrafts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warcrafts-${{ github.ref }}
  cancel-in-progress: true

env:
  RTS_VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  unit-tests:
    name: Unit tests (gestures, game files, CD keys, offline, updates)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Run unit tests
        run: gradle --no-daemon -p warcrafts/unit-tests test

  apk:
    name: Build Warcraft APK
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Read app settings
        run: |
          source warcrafts/app.env
          {
            echo "APP_ID=$APP_ID"
            echo "APP_NAME=$APP_NAME"
            echo "GAME_NAME=$GAME_NAME"
            echo "APK_FILE=$APK_NAME-$RTS_VERSION_NAME.apk"
            echo "RELEASE_TAG=$RELEASE_TAG_PREFIX-${{ github.run_number }}"
            echo "RELEASE_TAG_PREFIX=$RELEASE_TAG_PREFIX"
          } >> "$GITHUB_ENV"

      # The games' runtime, Winlator, with its install path rewritten for this app in every archive
      # (minutes, at zstd's highest level): made again only when its commit or the patches change.
      - name: Look for Winlator
        id: winlator
        uses: actions/cache/restore@v4
        with:
          path: warcrafts/android/winlator
          key: warcrafts-winlator-v1-${{ hashFiles('warcrafts/winlator-version.env', 'warcrafts/patches/winlator/**', 'scripts/prepare-winlator-app.sh', 'scripts/winlator-rewrite.py') }}

      - name: Prepare Winlator
        if: steps.winlator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-zstandard > /dev/null
          scripts/prepare-winlator-app.sh warcrafts

      - name: Save Winlator
        if: steps.winlator.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: warcrafts/android/winlator
          key: ${{ steps.winlator.outputs.cache-primary-key }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Winlator's native code is built with the NDK and CMake it's made for (app/build.gradle).
      - name: Install build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;36.0.0" \
            "ndk;24.0.8215888" "cmake;3.22.1" > /dev/null

      # Warcraft I and II, native: Stratagus, War1gus's and Wargus's tools, SDL (minutes): made again
      # only when the pins, the patches or the scripts that build them change.
      - name: Look for Stratagus
        id: stratagus
        uses: actions/cache/restore@v4
        with:
          path: warcrafts/android/stratagus
          key: warcrafts-stratagus-v1-${{ hashFiles('warcrafts/stratagus-version.env', 'warcrafts/patches/stratagus/**', 'warcrafts/patches/stratagus-deps/**', 'warcrafts/stratagus/**', 'scripts/build-stratagus.sh') }}

      - name: Build Stratagus
        if: steps.stratagus.outputs.cache-hit != 'true'
        run: |
          cmake --version | head -1
          ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/24.0.8215888" scripts/build-stratagus.sh

      - name: Save Stratagus
        if: steps.stratagus.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: warcrafts/android/stratagus
          key: ${{ steps.stratagus.outputs.cache-primary-key }}

      - name: Choose signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DOLPHINXD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RTS_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the key from the DOLPHINXD_KEYSTORE_* secrets."
          else
            echo "RTS_KEYSTORE=$GITHUB_WORKSPACE/ci/dolphinxd-ci.p12" >> "$GITHUB_ENV"
            echo "::notice::Signed with the shared CI key in ci/. Add DOLPHINXD_KEYSTORE_* secrets to use your own (see README)."
          fi

      - name: Build release APK
        working-directory: warcrafts/android
        env:
          RTS_STOREPASS: ${{ secrets.DOLPHINXD_KEYSTORE_PASSWORD || 'dolphinxd' }}
          RTS_KEYALIAS: ${{ secrets.DOLPHINXD_KEY_ALIAS || 'dolphinxd' }}
          RTS_KEYPASS: ${{ secrets.DOLPHINXD_KEY_PASSWORD || secrets.DOLPHINXD_KEYSTORE_PASSWORD || 'dolphinxd' }}
          # The app checks this repository's releases for updates. A private repository needs a
          # read-only token (see "Updates" in the README); a public one doesn't.
          RTS_UPDATE_TOKEN: ${{ secrets.DOLPHINXD_UPDATE_TOKEN }}
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease \
            -Pkeystore="$RTS_KEYSTORE" \
            -Pstorepass="$RTS_STOREPASS" \
            -Pkeyalias="$RTS_KEYALIAS" \
            -Pkeypass="$RTS_KEYPASS" \
            -PrtsVersionCode=${{ github.run_number }} \
            -PrtsVersionName="$RTS_VERSION_NAME" \
            -PrtsApplicationId="$APP_ID" \
            -PrtsUpdateRepo="$GITHUB_REPOSITORY" \
            -PrtsReleaseTagPrefix="$RELEASE_TAG_PREFIX" \
            -PrtsUpdateToken="$RTS_UPDATE_TOKEN"

      - name: Collect APK
        run: |
          mkdir -p dist
          cp warcrafts/android/app/build/outputs/apk/release/app-release.apk "dist/$APK_FILE"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "dist/$APK_FILE" | head -3
          unzip -l "dist/$APK_FILE" | grep -E "assets/(rootfs|container_pattern|stratagus/)|lib/arm64-v8a/(libwinlator|libmain|libwartool|libwar1tool)"
          ls -la dist

      # The APK is published as a GitHub release: release downloads work straight from a phone.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source warcrafts/winlator-version.env
          source warcrafts/stratagus-version.env
          notes="$APP_NAME for Android, offline: Warcraft I and II (GOG) native, played by Stratagus ${STRATAGUS_COMMIT::7} with War1gus ${WAR1GUS_COMMIT::7} and Wargus ${WARGUS_COMMIT::7}; Warcraft III 1.27 on Wine and Box64 inside the app (Blizzard's servers blocked unless you turn Private off). Touch gestures throughout. Built from commit ${GITHUB_SHA::7}.

          Download **$APK_FILE** below on your phone and open it to install. Then, for each game, **Game files** brings its files into the app (**Pick GOG installer** for Warcraft I and II, **Pick folder** or **Pick zip**), and **Press start** plays it. Warcraft III: **Game files → Download from Blizzard**, then its two install buttons.

          - **Warcraft: Orcs & Humans** (GOG): its offline installer as GOG gives it (setup_warcraft_….exe and every .bin file that came with it: Game files → Pick GOG installer), or its installed folder (WAR.EXE, DATA), or a zip of it; the app unpacks and converts it for the phone.
          - **Warcraft II: Battle.net Edition** (GOG): its offline installer (setup_warcraft_ii_….exe and its .bin files), or its installed folder (Install.mpq, Support/TOMES), or a zip of it; the app unpacks and converts it for the phone.
          - **Warcraft III** (Reign of Chaos and The Frozen Throne): set up on the phone: Game files → Download from Blizzard (Blizzard's classic 1.27 installers, about 1.4 GB), then install Reign of Chaos and The Frozen Throne in the app with your CD keys."
          # The tag first, on its own (see build-warcraft.yml: GitHub refuses some tokens a tag made by
          # gh release create --target).
          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" > /dev/null; then
            if ! gh api --include -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" > "$RUNNER_TEMP/tag.txt" 2>&1; then
              cat "$RUNNER_TEMP/tag.txt"
              head=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
              if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then
                echo "::warning::Not published: the branch has moved on to ${head::7}, whose run publishes the release."
                exit 0
              fi
              echo "::error::GitHub refused to create the tag $RELEASE_TAG (its answer is above)."
              exit 1
            fi
          fi
          gh release create "$RELEASE_TAG" "dist/$APK_FILE" \
            --verify-tag \
            --title "$APP_NAME $RTS_VERSION_NAME" \
            --notes "$notes"
