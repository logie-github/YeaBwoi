name: Check TWW download sources
on:
  push:
    paths: ['.github/workflows/check-tww-client.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install inspection tools
        run: pip install gdown pefile pillow requests
      - name: Inspect client and prepare launcher artwork
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, requests, subprocess, pathlib, json, hashlib, base64
          import gdown, pefile
          from PIL import Image
          for name,url in [
              ("tww_header","https://bnetcmsus-a.akamaihd.net/cms/content_entry_media/EDW9KKSLZUUR1723601550508.png"),
              ("tww_logo","https://firestorm-servers.com/assets/img/expansion/exp_glow_tww.png")]:
              response=requests.get(url, timeout=60); response.raise_for_status()
              path=pathlib.Path("/tmp/"+name+".png"); path.write_bytes(response.content)
              image=Image.open(path); image.verify()
              # Original publisher artwork, resized only to suit the app's header.
              image=Image.open(path).convert("RGBA")
              image.thumbnail((1920,1080) if name=="tww_header" else (900,500))
              import io
              data=io.BytesIO(); image.save(data,format="PNG",optimize=True)
              content=data.getvalue()
              r=requests.post("https://api.github.com/repos/"+os.environ["GH_REPO"]+"/git/blobs",
                  headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"},
                  json={"content":base64.b64encode(content).decode(),"encoding":"base64"},timeout=90)
              r.raise_for_status()
              print("ART",name,image.size,len(content),r.json()["sha"],flush=True)
          archive=gdown.download(id="1GXgO7jDJrdLsN7LDjkdBCW8i1fKSUPc1",output="/tmp/tww-client",quiet=False)
          if not archive: raise RuntimeError("Client source unavailable")
          p=pathlib.Path(archive)
          print("CLIENT_ARCHIVE",p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest(),p.read_bytes()[:16].hex(),flush=True)
          listing=subprocess.run(["7z","l","-slt",str(p)],capture_output=True,text=True,check=True).stdout
          print(listing[:40000],flush=True)
          dest=pathlib.Path("/tmp/client-exe");dest.mkdir()
          subprocess.run(["7z","e","-y","-o"+str(dest),str(p),"WoW.exe","Wow.exe","Wow-64.exe","*WoW.exe","*Wow.exe","*.build.info","*.wtf","*.build.db","*.idx","*.config","*.txt","*.json","*.bat","*.url","*.mfil","*.tact"],check=True)
          for f in dest.iterdir():
              if f.suffix.lower()==".exe":
                  pe=pefile.PE(str(f),fast_load=True);pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_RESOURCE"]])
                  for fi in getattr(pe,"VS_FIXEDFILEINFO",[]):
                      print("CLIENT_VERSION",f.name,fi.FileVersionMS>>16,fi.FileVersionMS&65535,fi.FileVersionLS>>16,fi.FileVersionLS&65535,flush=True)
              elif f.stat().st_size < 20000:
                  print("CLIENT_TEXT",f.name,f.read_text(errors="replace")[:8000],flush=True)
          PY
