name: Build Azure Dreams

# Builds the Azure Dreams app (the PlayStation game on the PCSX ReARMed core, through
# LibretroDroid) and publishes it as its own release (ad-build-N). Only changes to its files run it.
on:
  push:
    branches: ["**"]
    paths:
      - "azuredreams/**"
      - "!azuredreams/branding/**"
      - "!azuredreams/**.md"
      - "scripts/build-pcsx-rearmed.sh"
      - "scripts/prepare-libretrodroid.sh"
      - ".github/workflows/build-azuredreams.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: azuredreams-${{ github.ref }}
  cancel-in-progress: true

env:
  AD_VERSION_NAME: 1.0.${{ github.run_number }}
  NDK_VERSION: "29.0.14206865"

jobs:
  unit-tests:
    name: Unit tests (gestures, updates)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Run unit tests
        run: gradle --no-daemon -p azuredreams/unit-tests test

  apk:
    name: Build Azure Dreams APK
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read app settings
        run: |
          source azuredreams/app.env
          {
            echo "APP_ID=$APP_ID"
            echo "APP_NAME=$APP_NAME"
            echo "GAME_NAME=$GAME_NAME"
            echo "APK_FILE=$APK_NAME-$AD_VERSION_NAME.apk"
            echo "RELEASE_TAG_PREFIX=$RELEASE_TAG_PREFIX"
            echo "RELEASE_TAG=$RELEASE_TAG_PREFIX-${{ github.run_number }}"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;36.0.0" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # The PlayStation emulator core, from the commit pinned in azuredreams/core-version.env.
      - name: Build the emulator core
        run: scripts/build-pcsx-rearmed.sh

      # LibretroDroid from source, with the app's patches (the 2D-HD shader).
      - name: Prepare LibretroDroid
        run: scripts/prepare-libretrodroid.sh

      - name: Choose signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DOLPHINXD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "AD_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the key from the DOLPHINXD_KEYSTORE_* secrets."
          else
            echo "AD_KEYSTORE=$GITHUB_WORKSPACE/ci/dolphinxd-ci.p12" >> "$GITHUB_ENV"
            echo "::notice::Signed with the shared CI key in ci/. Add DOLPHINXD_KEYSTORE_* secrets to use your own (see README)."
          fi

      - name: Build release APK
        working-directory: azuredreams/android
        env:
          AD_STOREPASS: ${{ secrets.DOLPHINXD_KEYSTORE_PASSWORD || 'dolphinxd' }}
          AD_KEYALIAS: ${{ secrets.DOLPHINXD_KEY_ALIAS || 'dolphinxd' }}
          AD_KEYPASS: ${{ secrets.DOLPHINXD_KEY_PASSWORD || secrets.DOLPHINXD_KEYSTORE_PASSWORD || 'dolphinxd' }}
          # The app checks this repository's releases for updates. A private repository needs a
          # read-only token (see "Updates" in the README); a public one doesn't.
          AD_UPDATE_TOKEN: ${{ secrets.DOLPHINXD_UPDATE_TOKEN }}
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease \
            -Pkeystore="$AD_KEYSTORE" \
            -Pstorepass="$AD_STOREPASS" \
            -Pkeyalias="$AD_KEYALIAS" \
            -Pkeypass="$AD_KEYPASS" \
            -PadVersionCode=${{ github.run_number }} \
            -PadVersionName="$AD_VERSION_NAME" \
            -PadApplicationId="$APP_ID" \
            -PadUpdateRepo="$GITHUB_REPOSITORY" \
            -PadReleaseTagPrefix="$RELEASE_TAG_PREFIX" \
            -PadUpdateToken="$AD_UPDATE_TOKEN"

      - name: Collect APK
        run: |
          mkdir -p dist
          cp azuredreams/android/app/build/outputs/apk/release/app-release.apk "dist/$APK_FILE"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "dist/$APK_FILE" | head -3
          unzip -l "dist/$APK_FILE" | grep "lib/arm64-v8a/"
          ls -la dist

      # The APK is published as a GitHub release rather than a workflow artifact: release
      # downloads work straight from a phone and don't use the account's Actions storage quota.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source azuredreams/core-version.env
          source azuredreams/libretrodroid-version.env
          notes="$GAME_NAME (PlayStation) for Android, on PCSX ReARMed ${PCSX_REARMED_COMMIT::7} and LibretroDroid ${LIBRETRODROID_COMMIT::7}, built from commit ${GITHUB_SHA::7}.

          Download **$APK_FILE** below on your phone and open it to install. You need your own copy of the game's disc image."
          gh release create "$RELEASE_TAG" "dist/$APK_FILE" \
            --target "$GITHUB_SHA" \
            --title "$APP_NAME $AD_VERSION_NAME" \
            --notes "$notes"
