name: Test SPP Legion repack
on:
  push:
    paths: ['.github/workflows/test-spp-repack.yml', 'scripts/test-spp-repack.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install gdown
      - name: Start the actual SPP database, authentication and world server
        run: python scripts/test-spp-repack.py
