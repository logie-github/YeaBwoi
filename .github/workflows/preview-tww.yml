name: Preview War Within launcher
on:
  push:
    paths: ['.github/workflows/preview-tww.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the existing Windows runtime sources
        uses: actions/cache/restore@v4
        with:
          path: warcraft/android/winlator
          key: warcraft-winlator-v1-${{ hashFiles('warcraft/winlator-version.env', 'warcraft/patches/winlator/**', 'scripts/prepare-winlator.sh', 'scripts/winlator-rewrite.py') }}
          fail-on-cache-miss: true
      - name: Prepare temporary screenshot tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("warcraft/android/app/build.gradle")
          p.write_text(p.read_text()+'''
          android {
              testOptions.unitTests.includeAndroidResources = true
              testOptions.unitTests.all {
                  systemProperty 'robolectric.graphicsMode', 'NATIVE'
                  systemProperty 'robolectric.dependency.repo.url', 'https://maven-central.storage-download.googleapis.com/maven2'
                  maxHeapSize = '3g'
              }
          }
          dependencies {
              testImplementation 'junit:junit:4.13.2'
              testImplementation 'org.robolectric:robolectric:4.16'
              testImplementation 'androidx.compose.ui:ui-test-junit4'
              testImplementation 'androidx.test:core:1.6.1'
              debugImplementation 'androidx.compose.ui:ui-test-manifest'
          }
          ''')
          test=Path("warcraft/android/app/src/test/java/com/logie/warcraft/tww/ui/TwwPreviewTest.kt")
          test.parent.mkdir(parents=True,exist_ok=True)
          test.write_text('''package com.logie.warcraft.tww.ui
          import android.app.Application
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import androidx.activity.ComponentActivity
          import androidx.compose.ui.test.junit4.createAndroidComposeRule
          import androidx.compose.ui.test.onNodeWithText
          import androidx.compose.ui.test.performClick
          import org.junit.Rule
          import org.junit.Test
          import org.junit.runner.RunWith
          import org.robolectric.RobolectricTestRunner
          import org.robolectric.annotation.Config
          import org.robolectric.annotation.GraphicsMode
          import java.io.File
          @RunWith(RobolectricTestRunner::class)
          @GraphicsMode(GraphicsMode.Mode.NATIVE)
          @Config(sdk=[34], application=Application::class)
          class TwwPreviewTest {
              @get:Rule val compose = createAndroidComposeRule<ComponentActivity>()
              private fun render(name: String, files: Boolean=false) {
                  compose.mainClock.autoAdvance = false
                  compose.setContent { TwwLauncher(false) }
                  repeat(15) { compose.mainClock.advanceTimeBy(100); Thread.sleep(40) }
                  if (files) {
                      compose.onNodeWithText("Game Files").performClick()
                      compose.mainClock.advanceTimeBy(300)
                  }
                  compose.runOnIdle {
                      val view=compose.activity.window.decorView
                      val bitmap=Bitmap.createBitmap(view.width,view.height,Bitmap.Config.ARGB_8888)
                      view.draw(Canvas(bitmap))
                      if (files) {
                          val cls=Class.forName("android.view.WindowManagerGlobal")
                          val global=cls.getDeclaredMethod("getInstance").invoke(null)
                          val field=cls.getDeclaredField("mViews").apply { isAccessible=true }
                          val views=field.get(global) as List<*>
                          val top=views.last() as android.view.View
                          top.draw(Canvas(bitmap))
                      }
                      val output=File(System.getenv("GITHUB_WORKSPACE"),"tww-preview-"+name+".png")
                      output.outputStream().use { bitmap.compress(Bitmap.CompressFormat.PNG,100,it) }
                      bitmap.recycle()
                  }
              }
              @Test @Config(qualifiers="w411dp-h891dp-xxhdpi") fun phone() = render("phone")
              @Test @Config(qualifiers="w891dp-h411dp-xxhdpi") fun landscape() = render("landscape")
              @Test @Config(qualifiers="w840dp-h900dp-xhdpi") fun unfolded() = render("unfolded")
              @Test @Config(qualifiers="w411dp-h891dp-xxhdpi") fun gameFiles() = render("files",true)
          }
          ''')
          PY
      - name: Render actual Compose launcher
        working-directory: warcraft/android
        run: ./gradlew --no-daemon --max-workers=2 --init-script ../../scripts/maven-mirror.init.gradle :app:testDebugUnitTest --tests '*TwwPreviewTest' -PwowVersionName=1.0.207
      - name: Export screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,pathlib
          for p in sorted(pathlib.Path(".").glob("tww-preview-*.png")):
              print("TWW_SCREENSHOT",p.name,base64.b64encode(p.read_bytes()).decode(),flush=True)
          PY
          if gh release view wow-build-207 >/dev/null 2>&1; then
            gh release upload wow-build-207 tww-preview-*.png --clobber
          fi
