name: Build Wifecraft

# Builds Wifecraft (a Warcraft dating sim: its own OpenGL ES renderer for the game's models and
# Dalaran, a story player and WoW's own interface) and publishes it as its own release
# (wifecraft-N). The game's files aren't in the build: the app fetches them from wago.tools.
on:
  push:
    branches: ["**"]
    paths:
      - "wifecraft/**"
      - "!wifecraft/branding/**"
      - "!wifecraft/**.md"
      - "!wifecraft/engine-test/**"
      - "!wifecraft/tools/**"
      - ".github/workflows/build-wifecraft.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wifecraft-${{ github.ref }}
  cancel-in-progress: true

env:
  WC_VERSION_NAME: 1.0.${{ github.run_number }}
  NDK_VERSION: "29.0.14206865"
  CMAKE_VERSION: "3.31.6"

jobs:
  unit-tests:
    name: Unit tests (story script, the demo's routes, updates)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Run unit tests
        run: gradle --no-daemon -p wifecraft/unit-tests test

  apk:
    name: Build Wifecraft APK
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Read app settings
        run: |
          source wifecraft/app.env
          {
            echo "APP_ID=$APP_ID"
            echo "APP_NAME=$APP_NAME"
            echo "APK_FILE=$APK_NAME-$WC_VERSION_NAME.apk"
            echo "RELEASE_TAG_PREFIX=$RELEASE_TAG_PREFIX"
            echo "RELEASE_TAG=$RELEASE_TAG_PREFIX-${{ github.run_number }}"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;36.0.0" "cmake;$CMAKE_VERSION" > /dev/null

      - name: Choose signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DOLPHINXD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "WC_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the key from the DOLPHINXD_KEYSTORE_* secrets."
          else
            echo "WC_KEYSTORE=$GITHUB_WORKSPACE/ci/dolphinxd-ci.p12" >> "$GITHUB_ENV"
            echo "::notice::Signed with the shared CI key in ci/. Add DOLPHINXD_KEYSTORE_* secrets to use your own (see README)."
          fi

      - name: Build release APK
        working-directory: wifecraft/android
        env:
          WC_STOREPASS: ${{ secrets.DOLPHINXD_KEYSTORE_PASSWORD || 'dolphinxd' }}
          WC_KEYALIAS: ${{ secrets.DOLPHINXD_KEY_ALIAS || 'dolphinxd' }}
          WC_KEYPASS: ${{ secrets.DOLPHINXD_KEY_PASSWORD || secrets.DOLPHINXD_KEYSTORE_PASSWORD || 'dolphinxd' }}
          # The app checks this repository's releases for updates. A private repository needs a
          # read-only token (see "Updates" in the README); a public one doesn't.
          WC_UPDATE_TOKEN: ${{ secrets.DOLPHINXD_UPDATE_TOKEN }}
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease \
            -Pkeystore="$WC_KEYSTORE" \
            -Pstorepass="$WC_STOREPASS" \
            -Pkeyalias="$WC_KEYALIAS" \
            -Pkeypass="$WC_KEYPASS" \
            -PwcVersionCode=${{ github.run_number }} \
            -PwcVersionName="$WC_VERSION_NAME" \
            -PwcApplicationId="$APP_ID" \
            -PwcUpdateRepo="$GITHUB_REPOSITORY" \
            -PwcReleaseTagPrefix="$RELEASE_TAG_PREFIX" \
            -PwcUpdateToken="$WC_UPDATE_TOKEN"

      - name: Collect APK
        run: |
          mkdir -p dist
          cp wifecraft/android/app/build/outputs/apk/release/app-release.apk "dist/$APK_FILE"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "dist/$APK_FILE" | head -3
          unzip -l "dist/$APK_FILE" | grep "lib/arm64-v8a/libwcengine.so"
          ls -la dist

      # The APK is published as a GitHub release rather than a workflow artifact: release
      # downloads work straight from a phone and don't use the account's Actions storage quota.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$APP_NAME, a Warcraft dating sim, for Android, built from commit ${GITHUB_SHA::7}.

          Download **$APK_FILE** below on your phone and open it to install. On first launch it fetches Dalaran, its people and WoW's interface (about 295 MB) from wago.tools."
          gh release create "$RELEASE_TAG" "dist/$APK_FILE" \
            --target "$GITHUB_SHA" \
            --title "$APP_NAME $WC_VERSION_NAME" \
            --notes "$notes"
