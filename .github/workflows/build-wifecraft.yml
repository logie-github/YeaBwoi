name: Build Wifecraft

# Builds and publishes the signed Android APK (wifecraft-N).
# Warcraft models and location files are fetched by the app from wago.tools.
on:
  push:
    branches: ["**"]
    paths:
      - "wifecraft/**"
      - "!wifecraft/**.md"
      - "!wifecraft/engine-test/**"
      - "!wifecraft/tools/**"
      - ".github/workflows/build-wifecraft.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wifecraft-${{ github.ref }}
  cancel-in-progress: true

env:
  WC_VERSION_NAME: 1.0.${{ github.run_number }}
  NDK_VERSION: "29.0.14206865"
  CMAKE_VERSION: "3.31.6"

jobs:
  unit-tests:
    name: Unit tests (editor, story script and runner, creator, updates)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Run unit tests
        run: gradle --no-daemon -p wifecraft/unit-tests test

  apk:
    name: Build Wifecraft APK
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Read app settings
        run: |
          source wifecraft/app.env
          {
            echo "APP_ID=$APP_ID"
            echo "APP_NAME=$APP_NAME"
            echo "APK_FILE=$APK_NAME-$WC_VERSION_NAME.apk"
            echo "RELEASE_TAG_PREFIX=$RELEASE_TAG_PREFIX"
            echo "RELEASE_TAG=$RELEASE_TAG_PREFIX-${{ github.run_number }}"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;36.0.0" "cmake;$CMAKE_VERSION" > /dev/null

      - name: Choose signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DOLPHINXD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "WC_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the key from the DOLPHINXD_KEYSTORE_* secrets."
          else
            echo "WC_KEYSTORE=$GITHUB_WORKSPACE/ci/dolphinxd-ci.p12" >> "$GITHUB_ENV"
            echo "::notice::Signed with the shared CI key in ci/. Add DOLPHINXD_KEYSTORE_* secrets to use your own (see README)."
          fi

      - name: Build release APK
        working-directory: wifecraft/android
        env:
          WC_STOREPASS: ${{ secrets.DOLPHINXD_KEYSTORE_PASSWORD || 'dolphinxd' }}
          WC_KEYALIAS: ${{ secrets.DOLPHINXD_KEY_ALIAS || 'dolphinxd' }}
          WC_KEYPASS: ${{ secrets.DOLPHINXD_KEY_PASSWORD || secrets.DOLPHINXD_KEYSTORE_PASSWORD || 'dolphinxd' }}
          # The app checks this repository's releases for updates. A private repository needs a
          # read-only token (see "Updates" in the README); a public one doesn't.
          WC_UPDATE_TOKEN: ${{ secrets.DOLPHINXD_UPDATE_TOKEN }}
          # Move mode's item reports open issues here with this token (a fine-grained PAT, Issues: read and write on
          # this repository only); unset, the app keeps the reports on the phone (see "Move mode and item reports" in the README).
          WC_REPORT_TOKEN: ${{ secrets.WIFECRAFT_REPORT_TOKEN }}
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease \
            -Pkeystore="$WC_KEYSTORE" \
            -Pstorepass="$WC_STOREPASS" \
            -Pkeyalias="$WC_KEYALIAS" \
            -Pkeypass="$WC_KEYPASS" \
            -PwcVersionCode=${{ github.run_number }} \
            -PwcVersionName="$WC_VERSION_NAME" \
            -PwcApplicationId="$APP_ID" \
            -PwcUpdateRepo="$GITHUB_REPOSITORY" \
            -PwcReleaseTagPrefix="$RELEASE_TAG_PREFIX" \
            -PwcUpdateToken="$WC_UPDATE_TOKEN" \
            -PwcReportToken="$WC_REPORT_TOKEN"

      - name: Collect APK
        run: |
          mkdir -p dist
          cp wifecraft/android/app/build/outputs/apk/release/app-release.apk "dist/$APK_FILE"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "dist/$APK_FILE" | head -3
          unzip -l "dist/$APK_FILE" | grep "lib/arm64-v8a/libwcengine.so"
          ls -la dist

      # The APK is published as a GitHub release rather than a workflow artifact: release
      # downloads work straight from a phone and don't use the account's Actions storage quota.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$APP_NAME for Android, built from commit ${GITHUB_SHA::7}.

          Choose a preset scene, select or create NPCs, and pick the interactable furniture. NPCs act on their own until you select one and give them a command. Partner animations ask who joins, show a Ready to play preview with A and B roles, and can switch positions before and during play.

          Create NPCs in a Create-a-Sim style creator: race and sex, face, hair, makeup, accessories, personality, and a full-body sculpt (22 sliders, a Bust & Butt designer that updates live on the GPU, hold-and-drag on the body). Each NPC has one Gear switch: on wears the class's starting outfit, off is nude. There are two bodies: the Liard HD figure wherever a set is imported for the race and sex (a switch in Options and a per-character switch to use the game model instead), else the game's own model; the Eve body is gone.

          Cinematic mode plays a random sequence of compatible animations on the bed, floor, couch, chair or table, with a new camera angle at every change, a 4:3 frame, per-area lighting taken from each zone's own fog and ambient colours, and an auto-play panel. Immersive mode hides the interface.

          Options has a Graphics page (depth of field, bloom, shadows, ambient occlusion, MSAA, render scale, skin and eye shading, an adaptive governor aiming at 60 fps), Download everything with a background service, and Mods for your own Eve, body-part, Ralia and Sims 4 animation files.

          Move mode: in character mode, tap an item, say whether it is a chair, table top, floor or bed, and the NPC holds there; a report can be sent to the developer as a GitHub issue.

          Download **$APK_FILE** and open it on your phone to install. Warcraft models and the locations use the app's wago.tools downloads."
          gh release create "$RELEASE_TAG" "dist/$APK_FILE" \
            --target "$GITHUB_SHA" \
            --title "$APP_NAME $WC_VERSION_NAME" \
            --notes "$notes"
