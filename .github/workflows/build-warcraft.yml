name: Build World of Warcraft

# Builds the World of Warcraft app: its private server (AzerothCore at ChromieCraft's revision with
# playerbots, and MariaDB) for Linux arm64, tested here the way the phone runs it, on the server
# data the app downloads (warcraft/server-data.env); AzerothCore's data tools for Windows (to make
# the server's data from the client on a PC); and the app, which ships the server and the game's
# runtime, Winlator (scripts/prepare-winlator.sh, cached by its commit and the patches). Publishes
# the app and the Windows tools as a release (wow-build-N). A realm with the user's own modules is
# another workflow's (build-warcraft-modules.yml, started by the app).
#
# The server is cached at two levels: the compiled programs and SQL (scripts/compile-azerothcore.sh,
# the slow part) by what goes into the compile alone (the pins, the patches, the compile and fetch
# scripts), and the package (scripts/package-azerothcore.sh, minutes) by everything that goes into
# it. A change to the packaging (ctl.sh, the shim, the SQL layout) compiles nothing, and a change to
# the app alone reuses the package.
#
# Turtle WoW, the app's second game, has a realm of its own (Tortoise-WoW, warcraft/turtle): built
# for arm64 once for each version of what goes into it, tested the way the phone runs it, and
# published as a release of its own (turtle-server-<hash>, a prerelease) that the app downloads
# when Turtle WoW is installed. Each APK names the one it's made for, with its size and SHA-256.
on:
  push:
    branches: ["**"]
    paths:
      - "warcraft/**"
      - "!warcraft/branding/**"
      - "!warcraft/**.md"
      - "scripts/build-azerothcore.sh"
      - "scripts/compile-azerothcore.sh"
      - "scripts/package-azerothcore.sh"
      - "scripts/module-files.py"
      - "scripts/fetch-azerothcore.sh"
      - "scripts/test-warcraft-server.sh"
      - "scripts/build-tww-7zip.sh"
      - "scripts/prepare-winlator.sh"
      - "scripts/winlator-rewrite.py"
      - "scripts/build-box64.sh"
      - "scripts/fetch-tortoise.sh"
      - "scripts/compile-tortoise.sh"
      - "scripts/package-tortoise.sh"
      - "scripts/test-turtle-server.sh"
      - "scripts/turtle-manifests.py"
      - "scripts/fetch-legioncore.sh"
      - "scripts/compile-legioncore.sh"
      - "scripts/package-legioncore.sh"
      - "scripts/test-felsong-server.sh"
      - "scripts/felsong-server-hash.sh"
      - ".github/workflows/build-warcraft.yml"
  workflow_dispatch:

permissions:
  contents: write

# A run that's building the server isn't cancelled by the next push: that one waits, and then
# finds the server in the cache.
concurrency:
  group: warcraft-${{ github.ref }}
  cancel-in-progress: false

env:
  WOW_VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  server:
    name: Server for arm64 (build and test)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340
    outputs:
      key: ${{ steps.key.outputs.key }}
      tested-key: ${{ steps.key.outputs.tested-key }}
      tested: ${{ steps.tested.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache keys
        id: key
        run: |
          compile="warcraft-compile-v1-${{ hashFiles('warcraft/server-version.env', 'warcraft/patches/azerothcore/**', 'warcraft/patches/mod-*/**', 'warcraft/modules/**', 'scripts/fetch-azerothcore.sh', 'scripts/compile-azerothcore.sh') }}"
          key="warcraft-server-v2-${{ hashFiles('warcraft/server-version.env', 'warcraft/patches/azerothcore/**', 'warcraft/patches/mod-*/**', 'warcraft/modules/**', 'scripts/fetch-azerothcore.sh', 'scripts/compile-azerothcore.sh', 'scripts/package-azerothcore.sh', 'scripts/module-files.py', 'warcraft/server/ctl.sh', 'warcraft/server/create-databases.sql', 'warcraft/server/android_compat.c') }}"
          echo "COMPILE_KEY=$compile" >> "$GITHUB_ENV"
          # A test that passed on this package, this data and this test script: server-test leaves
          # it there (an arm64 runner for nothing on every app-only build).
          echo "tested-key=warcraft-server-tested-v1-${{ hashFiles('warcraft/server-version.env', 'warcraft/patches/azerothcore/**', 'warcraft/patches/mod-*/**', 'scripts/fetch-azerothcore.sh', 'scripts/compile-azerothcore.sh', 'scripts/package-azerothcore.sh', 'scripts/module-files.py', 'warcraft/server/**', 'warcraft/server-data.env', 'scripts/test-warcraft-server.sh') }}" >> "$GITHUB_OUTPUT"
          echo "SERVER_KEY=$key" >> "$GITHUB_ENV"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Look for the server package
        id: cached
        uses: actions/cache/restore@v4
        with:
          path: warcraft/android/server/server.tar.xz
          key: ${{ env.SERVER_KEY }}

      - name: Look for the compiled server
        id: compiled
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: build/azerothcore-dist
          key: ${{ env.COMPILE_KEY }}

      - name: Restore the compiler cache
        if: steps.cached.outputs.cache-hit != 'true' && steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: build/ccache
          key: warcraft-ccache-arm64-${{ github.run_id }}
          restore-keys: warcraft-ccache-arm64-

      - name: Compile the server
        if: steps.cached.outputs.cache-hit != 'true' && steps.compiled.outputs.cache-hit != 'true'
        run: |
          scripts/compile-azerothcore.sh
          sudo chown -R "$(id -u):$(id -g)" build

      - name: Save the compiler cache
        if: always() && steps.cached.outputs.cache-hit != 'true' && steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/ccache
          key: warcraft-ccache-arm64-${{ github.run_id }}

      - name: Save the compiled server
        if: steps.cached.outputs.cache-hit != 'true' && steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/azerothcore-dist
          key: ${{ env.COMPILE_KEY }}

      # The void elves' and the nightborne's files from Blizzard's game (mod-allied-races), fetched
      # once for each list of them.
      - name: The allied races' game files
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: build/allied-races-cache
          key: allied-races-files-v1-${{ hashFiles('warcraft/modules/mod-allied-races/data/retail/races.json') }}

      - name: Package the server
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          scripts/package-azerothcore.sh
          sudo chown -R "$(id -u):$(id -g)" build warcraft/android/server

      - name: Tested already?
        id: tested
        uses: actions/cache/restore@v4
        with:
          path: build/server-tested
          key: ${{ steps.key.outputs.tested-key }}
          lookup-only: true

      # Saved before the test, so a fix to the test doesn't package the server again.
      - name: Save the server package
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: warcraft/android/server/server.tar.xz
          key: ${{ env.SERVER_KEY }}

  # MariaDB, the database import, the auth server (a real login), and the world server on the
  # server data: started all the way, a character created and taken into the world, a GM command,
  # the shutdown the app does; then what earlier versions' custom races left taken out. From the
  # package as the phone unpacks it, with every system call checked against Android's seccomp
  # policy for apps. Runs once for each package, server data and test script: a build that changes
  # none of them (the app alone) uses the result of the run that tested them.
  server-test:
    name: Server for arm64 (test)
    needs: [server]
    if: needs.server.outputs.tested != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Get the server package
        uses: actions/cache/restore@v4
        with:
          path: warcraft/android/server/server.tar.xz
          key: ${{ needs.server.outputs.key }}
          fail-on-cache-miss: true

      # The server data the app downloads (warcraft/server-data.env), checked like the app checks it.
      - name: Get the server data
        run: |
          source warcraft/server-data.env
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/data.zip" "$SERVER_DATA_URL"
          echo "$SERVER_DATA_SHA256  $RUNNER_TEMP/data.zip" | sha256sum -c -
          echo "WOW_DATA_ZIP=$RUNNER_TEMP/data.zip" >> "$GITHUB_ENV"
          df -h / | tail -1

      # (Wrath Remix's campaign is played to its end on each side, scenes and all: about 95
      # minutes on a 4-core x86_64 machine, longer under strace)
      - name: Test the server
        timeout-minutes: 210
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace > /dev/null
          scripts/test-warcraft-server.sh

      - name: Remember it passed
        run: mkdir -p build/server-tested && echo "${{ github.run_id }}" > build/server-tested/run

      - uses: actions/cache/save@v4
        with:
          path: build/server-tested
          key: ${{ needs.server.outputs.tested-key }}

  # Turtle WoW's realm: Tortoise-WoW and ACE compiled for arm64 on musl (cached by the compile's
  # inputs, ccache across runs), packed with its own MariaDB and a seed database, tested
  # (scripts/test-turtle-server.sh), then published. Skipped when the release for these inputs is
  # there already: its turtle-server.json gives the APK the package's size and SHA-256.
  turtle-server:
    name: Turtle WoW realm for arm64 (build, test, publish)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340
    outputs:
      tag: ${{ steps.pin.outputs.tag }}
      sha256: ${{ steps.pin.outputs.sha256 }}
      size: ${{ steps.pin.outputs.size }}
      unpacked: ${{ steps.pin.outputs.unpacked }}
      commit: ${{ steps.pin.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Release tag and cache keys
        run: |
          hash="${{ hashFiles('warcraft/turtle/server-version.env', 'warcraft/turtle/patches/**', 'warcraft/turtle/server/**', 'warcraft/server/android_compat.c', 'scripts/fetch-tortoise.sh', 'scripts/compile-tortoise.sh', 'scripts/package-tortoise.sh', 'scripts/test-turtle-server.sh') }}"
          echo "TURTLE_TAG=turtle-server-${hash::12}" >> "$GITHUB_ENV"
          echo "COMPILE_KEY=turtle-compile-v1-${{ hashFiles('warcraft/turtle/server-version.env', 'warcraft/turtle/patches/**', 'scripts/fetch-tortoise.sh', 'scripts/compile-tortoise.sh') }}" >> "$GITHUB_ENV"
          mkdir -p build/turtle
          if gh release view "turtle-server-${hash::12}" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets.txt" 2> /dev/null &&
              grep -qx turtle-server.tar.xz "$RUNNER_TEMP/assets.txt" && grep -qx turtle-server.json "$RUNNER_TEMP/assets.txt"; then
            gh release download "turtle-server-${hash::12}" -p turtle-server.json -D build/turtle --clobber
            echo "Already published: turtle-server-${hash::12}"
            echo "PUBLISHED=1" >> "$GITHUB_ENV"
          fi

      - name: Look for the compiled realm
        id: compiled
        if: env.PUBLISHED != '1'
        uses: actions/cache/restore@v4
        with:
          path: build/tortoise-dist
          key: ${{ env.COMPILE_KEY }}

      - name: Restore the compiler cache
        if: env.PUBLISHED != '1' && steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: build/ccache-tortoise
          key: turtle-ccache-arm64-${{ github.run_id }}
          restore-keys: turtle-ccache-arm64-

      - name: Compile the realm
        if: env.PUBLISHED != '1' && steps.compiled.outputs.cache-hit != 'true'
        run: |
          scripts/compile-tortoise.sh
          sudo chown -R "$(id -u):$(id -g)" build

      - name: Save the compiler cache
        if: always() && env.PUBLISHED != '1' && steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/ccache-tortoise
          key: turtle-ccache-arm64-${{ github.run_id }}

      - name: Save the compiled realm
        if: env.PUBLISHED != '1' && steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/tortoise-dist
          key: ${{ env.COMPILE_KEY }}

      - name: Package the realm
        if: env.PUBLISHED != '1'
        run: |
          scripts/package-tortoise.sh
          sudo chown -R "$(id -u):$(id -g)" build

      - name: Test the realm
        if: env.PUBLISHED != '1'
        timeout-minutes: 60
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace > /dev/null
          scripts/test-turtle-server.sh

      # The tag first through the refs API (see the APK's release below), then the prerelease.
      - name: Publish the realm
        if: env.PUBLISHED != '1'
        run: |
          source warcraft/turtle/server-version.env
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TURTLE_TAG" > /dev/null; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TURTLE_TAG" -f sha="$GITHUB_SHA" > /dev/null
          fi
          gh release view "$TURTLE_TAG" > /dev/null 2>&1 && gh release delete "$TURTLE_TAG" --yes
          gh release create "$TURTLE_TAG" build/turtle/turtle-server.tar.xz build/turtle/turtle-server.json \
            --verify-tag --prerelease \
            --title "World of Warcraft: Turtle WoW realm (Tortoise-WoW ${TORTOISE_COMMIT::7})" \
            --notes "Turtle WoW's realm, which the World of Warcraft app downloads when Turtle WoW is installed: Tortoise-WoW ${TORTOISE_COMMIT::7} with ACE $ACE_VERSION and MariaDB for Android arm64 (musl), for the Turtle WoW 1.18.1 (7272) client, built from commit ${GITHUB_SHA::7}.

          \`\`\`
          $(cat build/turtle/turtle-server.json)
          \`\`\`"

      - name: The package's pin
        id: pin
        run: |
          python3 - "$TURTLE_TAG" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          info = json.load(open("build/turtle/turtle-server.json"))
          assert info["file"] == "turtle-server.tar.xz" and len(info["sha256"]) == 64 and info["size"] > 0
          print(f"tag={sys.argv[1]}")
          print(f"sha256={info['sha256']}")
          print(f"size={info['size']}")
          print(f"unpacked={info['unpacked']}")
          print(f"commit={info['tortoise']}")
          PY
          cat "$GITHUB_OUTPUT"

  # The Legion realm (the app's third game): LegionCore 7.3.5 compiled for arm64 on musl (cached by
  # the compile's inputs, ccache across runs), packed with its own MariaDB and a seed database with
  # LegionCore's world and hotfixes, tested (scripts/test-felsong-server.sh), then published as
  # felsong-server-<hash> (the name from when the game was planned as Felsong's realm). The hash is
  # scripts/felsong-server-hash.sh's, the same on any machine, so a package published from a
  # developer's machine is found here already. Skipped when the release is there: its
  # felsong-server.json gives the APK the package's size and SHA-256.
  felsong-server:
    name: Legion realm for arm64 (build, test, publish)
    runs-on: ubuntu-24.04-arm
    # (a failure here never holds the APK back: it's built without the realm's pin, and says so)
    continue-on-error: true
    timeout-minutes: 340
    outputs:
      tag: ${{ steps.pin.outputs.tag }}
      sha256: ${{ steps.pin.outputs.sha256 }}
      size: ${{ steps.pin.outputs.size }}
      unpacked: ${{ steps.pin.outputs.unpacked }}
      commit: ${{ steps.pin.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Release tag and cache keys
        run: |
          tag="$(scripts/felsong-server-hash.sh)"
          echo "FELSONG_TAG=$tag" >> "$GITHUB_ENV"
          echo "COMPILE_KEY=felsong-compile-v1-${{ hashFiles('warcraft/felsong/server-version.env', 'warcraft/felsong/patches/**', 'scripts/fetch-legioncore.sh', 'scripts/compile-legioncore.sh') }}" >> "$GITHUB_ENV"
          mkdir -p build/felsong
          if gh release view "$tag" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets.txt" 2> /dev/null &&
              grep -qx felsong-server.tar.xz "$RUNNER_TEMP/assets.txt" && grep -qx felsong-server.json "$RUNNER_TEMP/assets.txt"; then
            gh release download "$tag" -p felsong-server.json -D build/felsong --clobber
            echo "Already published: $tag"
            echo "PUBLISHED=1" >> "$GITHUB_ENV"
          fi

      - name: Look for the compiled realm
        id: compiled
        if: env.PUBLISHED != '1'
        uses: actions/cache/restore@v4
        with:
          path: build/legioncore-dist
          key: ${{ env.COMPILE_KEY }}

      - name: Restore the compiler cache
        if: env.PUBLISHED != '1' && steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: build/ccache-legioncore
          key: felsong-ccache-arm64-${{ github.run_id }}
          restore-keys: felsong-ccache-arm64-

      - name: Compile the realm
        if: env.PUBLISHED != '1' && steps.compiled.outputs.cache-hit != 'true'
        run: |
          scripts/compile-legioncore.sh
          sudo chown -R "$(id -u):$(id -g)" build

      - name: Save the compiler cache
        if: always() && env.PUBLISHED != '1' && steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/ccache-legioncore
          key: felsong-ccache-arm64-${{ github.run_id }}

      - name: Save the compiled realm
        if: env.PUBLISHED != '1' && steps.compiled.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/legioncore-dist
          key: ${{ env.COMPILE_KEY }}

      - name: Package the realm
        if: env.PUBLISHED != '1'
        run: |
          scripts/package-legioncore.sh
          sudo chown -R "$(id -u):$(id -g)" build

      - name: Test the realm
        if: env.PUBLISHED != '1'
        timeout-minutes: 60
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace > /dev/null
          scripts/test-felsong-server.sh

      # The tag first through the refs API (see the APK's release below), then the prerelease.
      - name: Publish the realm
        if: env.PUBLISHED != '1'
        run: |
          source warcraft/felsong/server-version.env
          if ! git ls-remote --exit-code --tags origin "refs/tags/$FELSONG_TAG" > /dev/null; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$FELSONG_TAG" -f sha="$GITHUB_SHA" > /dev/null
          fi
          gh release view "$FELSONG_TAG" > /dev/null 2>&1 && gh release delete "$FELSONG_TAG" --yes
          gh release create "$FELSONG_TAG" build/felsong/felsong-server.tar.xz build/felsong/felsong-server.json \
            --verify-tag --prerelease \
            --title "World of Warcraft: Legion realm (LegionCore ${LEGIONCORE_COMMIT::7})" \
            --notes "The Legion realm, which the World of Warcraft app downloads when Legion 7.3.5 is installed: LegionCore ${LEGIONCORE_COMMIT::7} with MariaDB for Android arm64 (musl), its world and hotfixes databases, the data tools and the connection patcher, for the 7.3.5 (26972) client, built from commit ${GITHUB_SHA::7}.

          \`\`\`
          $(cat build/felsong/felsong-server.json)
          \`\`\`"

      - name: The package's pin
        id: pin
        run: |
          python3 - "$FELSONG_TAG" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          info = json.load(open("build/felsong/felsong-server.json"))
          assert info["file"] == "felsong-server.tar.xz" and len(info["sha256"]) == 64 and info["size"] > 0
          print(f"tag={sys.argv[1]}")
          print(f"sha256={info['sha256']}")
          print(f"size={info['size']}")
          print(f"unpacked={info['unpacked']}")
          print(f"commit={info['legioncore']}")
          PY
          cat "$GITHUB_OUTPUT"


  windows-tools:
    name: Data tools for Windows
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache key
        id: key
        shell: bash
        run: |
          # Patches 0007 to 0010 change the game server only (selections, cutscenes and the
          # spellbook for the app's touch controls, the realms' module configs), not the data
          # tools: they don't make them again.
          key="warcraft-tools-windows-v1-${{ hashFiles('warcraft/server-version.env', 'warcraft/windows/**', 'warcraft/patches/azerothcore/**', '!warcraft/patches/azerothcore/0007-*', '!warcraft/patches/azerothcore/0008-*', '!warcraft/patches/azerothcore/0009-*', '!warcraft/patches/azerothcore/0010-*', 'scripts/fetch-azerothcore.sh') }}"
          echo "TOOLS_KEY=$key" >> "$GITHUB_ENV"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Look for the tools
        id: cached
        uses: actions/cache/restore@v4
        with:
          path: dist/WarcraftServerData-windows.zip
          key: ${{ env.TOOLS_KEY }}
          enableCrossOsArchive: true

      # Boost and the MySQL client headers (AzerothCore's build wants them even for the tools), the
      # way the playerbots fork's own Windows CI gets them.
      - name: Install Boost and MySQL
        if: steps.cached.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $boostExe = Join-Path $env:RUNNER_TEMP 'boost.exe'
          $boostUrl = 'https://downloads.sourceforge.net/project/boost/boost-binaries/1.87.0/boost_1_87_0-msvc-14.3-64.exe'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $boostUrl -OutFile $boostExe -UserAgent 'azerothcore-ci' -ConnectionTimeoutSeconds 60 -OperationTimeoutSeconds 60
              if ((Get-Item $boostExe).Length / 1MB -lt 50) { throw 'got an HTML page' }
              break
            } catch {
              Write-Host "Boost download attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds 15
            }
          }
          $p = Start-Process -FilePath $boostExe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\local\boost_1_87_0' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Boost installer failed: $($p.ExitCode)" }
          $mysqlZip = Join-Path $env:RUNNER_TEMP 'mysql.zip'
          Invoke-WebRequest -Uri 'https://cdn.mysql.com/archives/mysql-8.4/mysql-8.4.9-winx64.zip' -OutFile $mysqlZip -UserAgent 'Mozilla/5.0'
          New-Item -ItemType Directory -Force -Path 'C:\tools\mysql' | Out-Null
          Expand-Archive -Path $mysqlZip -DestinationPath 'C:\tools\mysql' -Force
          Rename-Item 'C:\tools\mysql\mysql-8.4.9-winx64' 'C:\tools\mysql\current'
          $openssl = @($env:OPENSSL_ROOT_DIR, 'C:\Program Files\OpenSSL', 'C:\Program Files\OpenSSL-Win64') |
            Where-Object { $_ -and (Test-Path (Join-Path $_ 'include\openssl\opensslv.h')) } | Select-Object -First 1
          if (-not $openssl) { throw 'No OpenSSL on the runner' }
          "OPENSSL_ROOT_DIR=$openssl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Get the server source
        if: steps.cached.outputs.cache-hit != 'true'
        shell: bash
        run: sh scripts/fetch-azerothcore.sh "$PWD/build/azerothcore"

      - name: Build the tools
        if: steps.cached.outputs.cache-hit != 'true'
        shell: bash
        env:
          BOOST_ROOT: C:\local\boost_1_87_0
        run: |
          cmake -S build/azerothcore -B build/ac-windows -A x64 \
            -DAPPS_BUILD=none -DTOOLS_BUILD=maps-only -DSCRIPTS=none -DMODULES=none \
            -DWITH_WARNINGS=0 -DUSE_COREPCH=1 -DBOOST_ROOT="$BOOST_ROOT"
          cmake --build build/ac-windows --config Release --parallel

      - name: Pack the tools
        if: steps.cached.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'dist\WarcraftServerData'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($tool in 'map_extractor','vmap4_extractor','vmap4_assembler','mmaps_generator') {
            $exe = Get-ChildItem -Path build\ac-windows -Recurse -Filter "$tool.exe" | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
            if (-not $exe) { throw "$tool.exe wasn't built" }
            Copy-Item $exe.FullName $out
          }
          # The DLLs they load: OpenSSL's, MySQL's and the Visual C++ runtime, found by name.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem -Path "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $crt = Get-ChildItem -Path "$vs\VC\Redist\MSVC" -Recurse -Directory -Filter 'Microsoft.VC*.CRT' | Where-Object { $_.FullName -match '\\x64\\' -and $_.FullName -notmatch 'onecore|debug' } | Select-Object -First 1
          $search = @("$env:OPENSSL_ROOT_DIR\bin", "$env:OPENSSL_ROOT_DIR", 'C:\tools\mysql\current\lib', 'C:\tools\mysql\current\bin', $crt.FullName)
          $needed = foreach ($exe in Get-ChildItem "$out\*.exe") {
            & $dumpbin.FullName /dependents $exe.FullName | Select-String -Pattern '^\s+(\S+\.dll)\s*$' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          }
          foreach ($dll in ($needed | Sort-Object -Unique)) {
            $found = $search | Where-Object { $_ -and (Test-Path (Join-Path $_ $dll)) } | Select-Object -First 1
            if ($found) { Copy-Item (Join-Path $found $dll) $out; Write-Host "bundled $dll" } else { Write-Host "system $dll" }
          }
          Copy-Item build\azerothcore\src\tools\mmaps_generator\mmaps-config.yaml $out
          Copy-Item warcraft\windows\extract-server-data.bat $out
          Copy-Item warcraft\windows\README.txt $out
          Get-ChildItem $out
          Compress-Archive -Path "$out\*" -DestinationPath dist\WarcraftServerData-windows.zip

      - name: Save the tools
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/WarcraftServerData-windows.zip
          key: ${{ env.TOOLS_KEY }}
          enableCrossOsArchive: true

  unit-tests:
    name: Unit tests (accounts, configs, client, updates)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Run unit tests
        run: gradle --no-daemon -p warcraft/unit-tests test

      # The Skyborne's character screen code in Lua 5.1 against stand-ins for the game's screen.
      - name: The Skyborne's character screen
        run: |
          python3 -m venv "$RUNNER_TEMP/lua"
          "$RUNNER_TEMP/lua/bin/pip" install --quiet lupa
          "$RUNNER_TEMP/lua/bin/python" warcraft/modules/mod-skyborne/tools/test_screen.py
          "$RUNNER_TEMP/lua/bin/python" warcraft/modules/mod-skyborne/tools/test_zoom.py
          "$RUNNER_TEMP/lua/bin/python" warcraft/modules/mod-allied-races/tools/test_screen.py

      # The allied races' tools: the model converter's pieces, the textures' codec, the tables'
      # data, the voices (with ffmpeg), the intros' narrations through a patch, both race patches'
      # voice tables and the creatures' races moved in a client's own rows (mod-allied-races,
      # mod-skyborne).
      - name: The allied races' tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python3 -m venv "$RUNNER_TEMP/allied"
          "$RUNNER_TEMP/allied/bin/pip" install --quiet numpy pillow
          "$RUNNER_TEMP/allied/bin/python" warcraft/modules/mod-allied-races/tools/test_tools.py
          "$RUNNER_TEMP/allied/bin/python" warcraft/modules/mod-allied-races/tools/test_safety.py
          "$RUNNER_TEMP/allied/bin/python" warcraft/modules/mod-allied-races/tools/test_voices.py
          g++ -std=c++17 -O2 -Iwarcraft/modules/mod-allied-races/src -Iwarcraft/modules/mod-skyborne/src \
            warcraft/modules/mod-allied-races/tools/test_intro.cpp warcraft/modules/mod-allied-races/src/AlliedRacesPatch.cpp \
            warcraft/modules/mod-skyborne/src/SkyborneFiles.cpp -lz -o "$RUNNER_TEMP/test-allied-intro"
          "$RUNNER_TEMP/test-allied-intro" warcraft/modules/mod-allied-races/data/client
          g++ -std=c++17 -O2 -Iwarcraft/modules/mod-skyborne/src warcraft/modules/mod-allied-races/tools/test_voice_tables.cpp \
            warcraft/modules/mod-skyborne/src/SkyborneFiles.cpp -lz -o "$RUNNER_TEMP/test-voice-tables"
          "$RUNNER_TEMP/test-voice-tables" warcraft/modules/mod-allied-races/data/client warcraft/modules/mod-skyborne/data/client
          g++ -std=c++17 -O2 -Iwarcraft/modules/mod-skyborne/src warcraft/modules/mod-skyborne/tools/test_table_moves.cpp \
            warcraft/modules/mod-skyborne/src/SkyborneFiles.cpp -lz -o "$RUNNER_TEMP/test-table-moves"
          "$RUNNER_TEMP/test-table-moves" warcraft/modules/mod-skyborne/data/client warcraft/modules/mod-allied-races/data/client

      # The checksums the app checks a Turtle WoW client and its DBC files against come from the
      # pinned Tortoise-WoW; they must be the ones at that commit.
      - name: Turtle WoW's checksums match the pinned Tortoise-WoW
        run: |
          sh scripts/fetch-tortoise.sh "$PWD/build/tortoise"
          python3 -I scripts/turtle-manifests.py --check build/tortoise warcraft/android/app/src/main/assets/turtle

  # The server package and the Windows tools come from the jobs above through the cache (the
  # account's artifact storage is full, and releases are what the phone downloads anyway).
  apk:
    name: Build World of Warcraft APK
    # The server test (server-test: hours, with Wrath Remix's whole campaign on each side) runs
    # alongside and doesn't hold the release back, at the user's choice: they play the build
    # themselves; its result is on the run. Anything here failed or cancelled stops the APK.
    needs: [unit-tests, server, windows-tools, turtle-server, felsong-server]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Read app settings
        run: |
          source warcraft/app.env
          {
            echo "APP_ID=$APP_ID"
            echo "APP_NAME=$APP_NAME"
            echo "GAME_NAME=$GAME_NAME"
            echo "APK_FILE=$APK_NAME-$WOW_VERSION_NAME.apk"
            echo "RELEASE_TAG=$RELEASE_TAG_PREFIX-${{ github.run_number }}"
            echo "RELEASE_TAG_PREFIX=$RELEASE_TAG_PREFIX"
          } >> "$GITHUB_ENV"

      - name: Get the server package
        uses: actions/cache/restore@v4
        with:
          path: warcraft/android/server/server.tar.xz
          key: ${{ needs.server.outputs.key }}
          fail-on-cache-miss: true

      - name: Get the Windows tools
        uses: actions/cache/restore@v4
        with:
          path: dist/WarcraftServerData-windows.zip
          key: ${{ needs.windows-tools.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # The game's runtime, Winlator, with its install path rewritten for this app in every archive
      # (minutes, at zstd's highest level): made again only when its commit or the patches change.
      - name: Look for Winlator
        id: winlator
        uses: actions/cache/restore@v4
        with:
          path: warcraft/android/winlator
          key: warcraft-winlator-v1-${{ hashFiles('warcraft/winlator-version.env', 'warcraft/patches/winlator/**', 'scripts/prepare-winlator.sh', 'scripts/winlator-rewrite.py', 'warcraft/box64-version.env', 'warcraft/patches/box64/**', 'scripts/build-box64.sh') }}

      - name: Prepare Winlator
        if: steps.winlator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-zstandard gcc-aarch64-linux-gnu g++-aarch64-linux-gnu patchelf zstd > /dev/null
          scripts/prepare-winlator.sh

      - name: Save Winlator
        if: steps.winlator.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: warcraft/android/winlator
          key: ${{ steps.winlator.outputs.cache-primary-key }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Winlator's native code is built with the NDK and CMake it's made for (app/build.gradle).
      - name: Install build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;36.0.0" \
            "ndk;24.0.8215888" "cmake;3.22.1" > /dev/null

      - name: Choose signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DOLPHINXD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "WOW_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the key from the DOLPHINXD_KEYSTORE_* secrets."
          else
            echo "WOW_KEYSTORE=$GITHUB_WORKSPACE/ci/dolphinxd-ci.p12" >> "$GITHUB_ENV"
            echo "::notice::Signed with the shared CI key in ci/. Add DOLPHINXD_KEYSTORE_* secrets to use your own (see README)."
          fi

      - name: Android background and cancellation regression tests
        working-directory: warcraft/android
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest

      - name: Build TWW archive extractor
        run: scripts/build-tww-7zip.sh

      - name: Build release APK
        working-directory: warcraft/android
        env:
          WOW_STOREPASS: ${{ secrets.DOLPHINXD_KEYSTORE_PASSWORD || 'dolphinxd' }}
          WOW_KEYALIAS: ${{ secrets.DOLPHINXD_KEY_ALIAS || 'dolphinxd' }}
          WOW_KEYPASS: ${{ secrets.DOLPHINXD_KEY_PASSWORD || secrets.DOLPHINXD_KEYSTORE_PASSWORD || 'dolphinxd' }}
          # The app checks this repository's releases for updates. A private repository needs a
          # read-only token (see "Updates" in the README); a public one doesn't.
          WOW_UPDATE_TOKEN: ${{ secrets.DOLPHINXD_UPDATE_TOKEN }}
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease \
            -Pkeystore="$WOW_KEYSTORE" \
            -Pstorepass="$WOW_STOREPASS" \
            -Pkeyalias="$WOW_KEYALIAS" \
            -Pkeypass="$WOW_KEYPASS" \
            -PwowVersionCode=${{ github.run_number }} \
            -PwowVersionName="$WOW_VERSION_NAME" \
            -PwowApplicationId="$APP_ID" \
            -PwowUpdateRepo="$GITHUB_REPOSITORY" \
            -PwowReleaseTagPrefix="$RELEASE_TAG_PREFIX" \
            -PwowBuildBranch="$GITHUB_REF_NAME" \
            -PwowUpdateToken="$WOW_UPDATE_TOKEN" \
            -PturtleServerTag="${{ needs.turtle-server.outputs.tag }}" \
            -PturtleServerSha256="${{ needs.turtle-server.outputs.sha256 }}" \
            -PturtleServerSize="${{ needs.turtle-server.outputs.size }}" \
            -PturtleServerUnpacked="${{ needs.turtle-server.outputs.unpacked }}" \
            -PturtleServerCommit="${{ needs.turtle-server.outputs.commit }}" \
            -PfelsongServerTag="${{ needs.felsong-server.outputs.tag }}" \
            -PfelsongServerSha256="${{ needs.felsong-server.outputs.sha256 }}" \
            -PfelsongServerSize="${{ needs.felsong-server.outputs.size }}" \
            -PfelsongServerUnpacked="${{ needs.felsong-server.outputs.unpacked }}" \
            -PfelsongServerCommit="${{ needs.felsong-server.outputs.commit }}"

      - name: Collect APK
        run: |
          mkdir -p dist
          cp warcraft/android/app/build/outputs/apk/release/app-release.apk "dist/$APK_FILE"
          cp warcraft/android/app/build/reports/spp-previews/*.jpg dist/
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "dist/$APK_FILE" | head -3
          unzip -l "dist/$APK_FILE" | grep -E "assets/(server|rootfs|container_pattern)|lib/arm64-v8a/libwinlator"
          tar -xJOf warcraft/android/server/server.tar.xz server/VERSION | tee dist/server-version.txt
          ls -la dist

      # The APK is published as a GitHub release rather than a workflow artifact: release
      # downloads work straight from a phone and don't use the account's Actions storage quota.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source warcraft/server-version.env
          source warcraft/server-data.env
          notes="$GAME_NAME (3.3.5a) for Android: the game on the phone (your own client, run by Wine and Box64 inside the app, with touch gestures), with a ChromieCraft realm on the phone: AzerothCore ${CORE_COMMIT::7} (ChromieCraft's) with playerbots ${PLAYERBOT_CORE_COMMIT::7}, built from commit ${GITHUB_SHA::7}.

          Download **$APK_FILE** below on your phone and open it to install. You need your own World of Warcraft 3.3.5a (12340) client: **Game files → Your client → Pick folder** (or **Pick zip**) copies it into the app, then **Press start** starts the realm and the game.

          **Server data:** in the app, **Game files → Download server data** gets AzerothCore's ready-made data ($SERVER_DATA_VERSION, $((SERVER_DATA_SIZE / 1000000)) MB), the data CI tests this build's server on (the test runs alongside the release, not before it: its result is on the build's run). **WarcraftServerData-windows.zip** makes it from your own client on a Windows PC instead (see its README.txt).

          **Turtle WoW — Vanilla+** (a second game, switched to from the launcher): its own realm, Tortoise-WoW ${{ needs.turtle-server.outputs.commit }} (release ${{ needs.turtle-server.outputs.tag }}), installed from the Turtle WoW launcher in one tap, with your own Turtle WoW 1.18.1 (7272) client. Nothing of the 3.3.5a game changes.

          **Legion 7.3.5** (a third game, switched to from the launcher): your own World of Warcraft 7.3.5 (26972) client on a LegionCore realm on the phone, LegionCore ${{ needs.felsong-server.outputs.commit }} (release ${{ needs.felsong-server.outputs.tag }}), installed from its launcher step by step (the realm in one tap; the client is yours to add; the server data made on the phone or imported). Legion's client on a phone is unverified. Nothing of the other games changes.

          **The War Within — 11.2.5** keeps its separate Draconic installation and active Uniform Server database.

          Server package:
          \`\`\`
          $(cat dist/server-version.txt)
          \`\`\`"
          # The tag first, on its own. GitHub refuses this token a tag (HTTP 403, "Resource not
          # accessible by integration") on a commit whose workflow file isn't the branch's latest
          # (run 40: a newer commit that changed this file came while it built). The newer
          # commit's run publishes then; this one stands down.
          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" > /dev/null; then
            if ! gh api --include -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" > "$RUNNER_TEMP/tag.txt" 2>&1; then
              cat "$RUNNER_TEMP/tag.txt"
              head=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
              if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then
                echo "::warning::Not published: the branch has moved on to ${head::7}, whose run publishes the release."
                exit 0
              fi
              echo "::error::GitHub refused to create the tag $RELEASE_TAG (its answer is above)."
              exit 1
            fi
          fi
          # Only the default branch's builds are offered to the app as updates (it skips
          # prereleases): a build from another branch, missing the default branch's newer fixes,
          # must never replace them on the phone. Its APK stays downloadable here.
          prerelease=()
          if [ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]; then
            prerelease=(--prerelease)
            notes="**Test build from the branch \`$GITHUB_REF_NAME\`**, not offered to the app as an update: the app takes the default branch's builds only.

          $notes"
          fi
          gh release create "$RELEASE_TAG" "dist/$APK_FILE" dist/WarcraftServerData-windows.zip dist/spp-*.jpg \
            --verify-tag "${prerelease[@]}" \
            --title "$APP_NAME $WOW_VERSION_NAME" \
            --notes "$notes"
