name: Inspect SPP Legion sources
on:
  push:
    paths: ['.github/workflows/check-spp-sources.yml', 'scripts/inspect-spp-sources.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install gdown
      - name: Inspect SPP AshamaneCore and the matching Legion client without executing files
        run: python scripts/inspect-spp-sources.py
