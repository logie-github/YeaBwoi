name: Build Parasite Eve

# Builds the Parasite Eve app (the PlayStation game on the SwanStation core, through LibretroDroid)
# and publishes it as its own release (pe-build-N). It runs on the Azure Dreams app's emulator build
# (the core and LibretroDroid with azuredreams/patches/), so changes to that run it too.
on:
  push:
    branches: ["**"]
    paths:
      - "parasiteeve/**"
      - "!parasiteeve/branding/**"
      - "!parasiteeve/**.md"
      - "azuredreams/patches/**"
      - "azuredreams/core-version.env"
      - "azuredreams/libretrodroid-version.env"
      - "azuredreams/android/libretrodroid/**"
      - "scripts/build-swanstation.sh"
      - "scripts/prepare-libretrodroid.sh"
      - ".github/workflows/build-parasiteeve.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parasiteeve-${{ github.ref }}
  cancel-in-progress: true

env:
  PE_VERSION_NAME: 1.0.${{ github.run_number }}
  NDK_VERSION: "29.0.14206865"
  CMAKE_VERSION: "3.31.6"

jobs:
  unit-tests:
    name: Unit tests (gestures, updates, discs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Run unit tests
        run: gradle --no-daemon -p parasiteeve/unit-tests test

  apk:
    name: Build Parasite Eve APK
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read app settings
        run: |
          source parasiteeve/app.env
          {
            echo "APP_ID=$APP_ID"
            echo "APP_NAME=$APP_NAME"
            echo "GAME_NAME=$GAME_NAME"
            echo "APK_FILE=$APK_NAME-$PE_VERSION_NAME.apk"
            echo "RELEASE_TAG_PREFIX=$RELEASE_TAG_PREFIX"
            echo "RELEASE_TAG=$RELEASE_TAG_PREFIX-${{ github.run_number }}"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;36.0.0" "cmake;$CMAKE_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "CMAKE=$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/cmake" >> "$GITHUB_ENV"
          echo "NINJA=$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/ninja" >> "$GITHUB_ENV"

      # The PlayStation emulator core, from the commit pinned in azuredreams/core-version.env (the
      # same core as the Azure Dreams app's).
      - name: Build the emulator core
        run: scripts/build-swanstation.sh

      # LibretroDroid from source, with azuredreams/patches/libretrodroid/ (cores that draw with
      # OpenGL ES, fast forward's time-stretched sound, ...), shared with the Azure Dreams app.
      - name: Prepare LibretroDroid
        run: scripts/prepare-libretrodroid.sh

      - name: Choose signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DOLPHINXD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "PE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the key from the DOLPHINXD_KEYSTORE_* secrets."
          else
            echo "PE_KEYSTORE=$GITHUB_WORKSPACE/ci/dolphinxd-ci.p12" >> "$GITHUB_ENV"
            echo "::notice::Signed with the shared CI key in ci/. Add DOLPHINXD_KEYSTORE_* secrets to use your own (see README)."
          fi

      - name: Build release APK
        working-directory: parasiteeve/android
        env:
          PE_STOREPASS: ${{ secrets.DOLPHINXD_KEYSTORE_PASSWORD || 'dolphinxd' }}
          PE_KEYALIAS: ${{ secrets.DOLPHINXD_KEY_ALIAS || 'dolphinxd' }}
          PE_KEYPASS: ${{ secrets.DOLPHINXD_KEY_PASSWORD || secrets.DOLPHINXD_KEYSTORE_PASSWORD || 'dolphinxd' }}
          # The app checks this repository's releases for updates. A private repository needs a
          # read-only token (see "Updates" in the README); a public one doesn't.
          PE_UPDATE_TOKEN: ${{ secrets.DOLPHINXD_UPDATE_TOKEN }}
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease \
            -Pkeystore="$PE_KEYSTORE" \
            -Pstorepass="$PE_STOREPASS" \
            -Pkeyalias="$PE_KEYALIAS" \
            -Pkeypass="$PE_KEYPASS" \
            -PpeVersionCode=${{ github.run_number }} \
            -PpeVersionName="$PE_VERSION_NAME" \
            -PpeApplicationId="$APP_ID" \
            -PpeUpdateRepo="$GITHUB_REPOSITORY" \
            -PpeReleaseTagPrefix="$RELEASE_TAG_PREFIX" \
            -PpeUpdateToken="$PE_UPDATE_TOKEN"

      - name: Collect APK
        run: |
          mkdir -p dist
          cp parasiteeve/android/app/build/outputs/apk/release/app-release.apk "dist/$APK_FILE"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "dist/$APK_FILE" | head -3
          unzip -l "dist/$APK_FILE" | grep "lib/arm64-v8a/"
          ls -la dist

      # The APK is published as a GitHub release rather than a workflow artifact: release
      # downloads work straight from a phone and don't use the account's Actions storage quota.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source azuredreams/core-version.env
          source azuredreams/libretrodroid-version.env
          notes="$GAME_NAME (PlayStation) for Android, on SwanStation ${SWANSTATION_COMMIT::7} and LibretroDroid ${LIBRETRODROID_COMMIT::7}, built from commit ${GITHUB_SHA::7}.

          Download **$APK_FILE** below on your phone and open it to install. You need your own copy of the game's two discs."
          gh release create "$RELEASE_TAG" "dist/$APK_FILE" \
            --target "$GITHUB_SHA" \
            --title "$APP_NAME $PE_VERSION_NAME" \
            --notes "$notes"
